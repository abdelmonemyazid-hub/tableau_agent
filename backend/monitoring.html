<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viz Agent — Monitoring</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --surface2:  #22263a;
      --border:    #2d3150;
      --blue:      #4f8ef7;
      --blue-dim:  #1e3a6e;
      --green:     #22c55e;
      --green-dim: #14532d;
      --red:       #f87171;
      --red-dim:   #7f1d1d;
      --yellow:    #fbbf24;
      --yellow-dim:#78350f;
      --gray:      #6b7280;
      --text:      #e2e8f0;
      --text-dim:  #94a3b8;
      --mono:      "Cascadia Code", "Courier New", monospace;
      --radius:    6px;
    }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 13px;
    }

    /* ── Top bar ── */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 15px; font-weight: 700; color: var(--blue); }
    header .sub { color: var(--text-dim); font-size: 12px; }
    header .spacer { flex: 1; }
    #refresh-btn {
      padding: 5px 14px;
      background: var(--blue-dim);
      color: var(--blue);
      border: 1px solid var(--blue);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    #refresh-btn:hover { background: var(--blue); color: #fff; }
    #auto-label { color: var(--text-dim); font-size: 11px; display: flex; align-items: center; gap: 5px; }
    #auto-toggle { cursor: pointer; accent-color: var(--blue); }

    /* ── Layout ── */
    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      height: calc(100vh - 49px);
      overflow: hidden;
    }

    /* ── Run list ── */
    #run-list-panel {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    #run-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .run-item {
      padding: 9px 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      cursor: pointer;
      background: var(--surface);
      transition: border-color 0.15s, background 0.15s;
    }
    .run-item:hover  { border-color: var(--blue); background: var(--surface2); }
    .run-item.active { border-color: var(--blue); background: var(--blue-dim); }

    .run-item-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .run-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      text-transform: uppercase;
    }
    .badge-generate { background: var(--blue-dim); color: var(--blue); }
    .badge-refine   { background: #2d1f5e; color: #a78bfa; }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-success { background: var(--green); }
    .dot-error   { background: var(--red); }

    .run-question {
      flex: 1;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .run-meta {
      display: flex;
      gap: 10px;
      font-size: 10px;
      color: var(--text-dim);
    }
    .run-viz-type {
      font-family: var(--mono);
      font-size: 10px;
      padding: 1px 5px;
      background: var(--surface2);
      border-radius: 3px;
      color: var(--green);
    }

    /* ── Detail panel ── */
    #detail-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #detail-header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    #detail-question {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }
    #detail-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
    }
    .detail-status {
      font-weight: 700;
      font-size: 12px;
    }
    .detail-status.success { color: var(--green); }
    .detail-status.error   { color: var(--red); }

    #detail-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Flow graph ── */
    #flow-graph {
      display: flex;
      align-items: flex-start;
      gap: 0;
      overflow-x: auto;
      padding: 12px 0;
    }

    .flow-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      min-width: 110px;
      cursor: pointer;
    }
    .flow-node-box {
      width: 96px;
      padding: 8px 6px;
      border-radius: 8px;
      border: 2px solid var(--border);
      background: var(--surface2);
      text-align: center;
      transition: border-color 0.2s, box-shadow 0.2s;
      position: relative;
    }
    .flow-node:hover .flow-node-box { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(79,142,247,.15); }
    .flow-node.active .flow-node-box { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(79,142,247,.2); }

    .flow-node-box.status-success { border-color: var(--green); }
    .flow-node-box.status-error   { border-color: var(--red);   }
    .flow-node-box.status-pending { border-color: var(--border); opacity: 0.5; }
    .flow-node-box.status-in_progress { border-color: var(--yellow); animation: pulse-border 1s ease-in-out infinite; }

    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 0 2px rgba(251,191,36,.15); }
      50%       { box-shadow: 0 0 0 5px rgba(251,191,36,.3); }
    }

    .flow-icon { font-size: 18px; margin-bottom: 2px; }
    .flow-label { font-size: 10px; font-weight: 600; color: var(--text-dim); }
    .flow-duration {
      font-size: 9px;
      font-family: var(--mono);
      margin-top: 3px;
    }
    .status-success .flow-duration { color: var(--green); }
    .status-error   .flow-duration { color: var(--red); }
    .status-in_progress .flow-duration { color: var(--yellow); }

    .flow-connector {
      display: flex;
      align-items: center;
      align-self: center;
      margin-top: -18px;
    }
    .flow-connector svg { color: var(--border); }
    .flow-connector.done svg { color: var(--green); }

    /* ── Step IO card ── */
    #step-io-area { display: flex; flex-direction: column; gap: 8px; }

    .io-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
    }
    .io-card-header {
      padding: 7px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }
    .io-card-title { font-size: 12px; font-weight: 600; color: var(--text); flex: 1; }
    .io-duration {
      font-size: 10px;
      font-family: var(--mono);
      color: var(--text-dim);
    }
    .io-status-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 3px;
      text-transform: uppercase;
    }
    .io-status-badge.success { background: var(--green-dim);  color: var(--green); }
    .io-status-badge.error   { background: var(--red-dim);    color: var(--red); }
    .io-status-badge.pending { background: var(--surface2);   color: var(--gray); }
    .io-status-badge.in_progress { background: var(--yellow-dim); color: var(--yellow); }

    .io-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
    }
    .io-cell {
      padding: 8px 12px;
      background: var(--surface);
    }
    .io-cell-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }
    .io-cell.in  .io-cell-label { color: var(--blue); }
    .io-cell.out .io-cell-label { color: var(--green); }
    .io-cell pre {
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--text);
      max-height: 130px;
      overflow-y: auto;
    }
    .io-error {
      padding: 8px 12px;
      font-size: 11px;
      color: var(--red);
      background: var(--red-dim);
      font-family: var(--mono);
    }

    /* ── Reasoning ── */
    #reasoning-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    #reasoning-card summary {
      padding: 8px 12px;
      background: var(--surface2);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid transparent;
    }
    #reasoning-card[open] summary { border-color: var(--border); color: var(--text); }
    #reasoning-card summary::-webkit-details-marker { display: none; }
    #reasoning-text {
      padding: 10px 12px;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.6;
      white-space: pre-wrap;
      color: #93c5fd;
      background: #0c1929;
      max-height: 240px;
      overflow-y: auto;
    }

    /* ── Empty state ── */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 10px;
      color: var(--text-dim);
      font-size: 13px;
    }
    #empty-state .icon { font-size: 36px; opacity: 0.4; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .none-label { color: var(--text-dim); font-style: italic; font-size: 11px; }
  </style>
</head>
<body>

<header>
  <h1>⬡ Viz Agent — Flow Monitor</h1>
  <span class="sub" id="header-model">Loading…</span>
  <div class="spacer"></div>
  <label class="auto-label" id="auto-label">
    <input type="checkbox" id="auto-toggle" checked>
    Auto-refresh (5s)
  </label>
  &nbsp;
  <button id="refresh-btn">⟳ Refresh</button>
</header>

<div class="layout">
  <!-- ── Run list ── -->
  <div id="run-list-panel">
    <div class="panel-header">Pipeline Runs</div>
    <div id="run-list">
      <div class="none-label" style="padding:16px">No runs yet. Generate a viz to start.</div>
    </div>
  </div>

  <!-- ── Detail ── -->
  <div id="detail-panel">
    <div id="empty-state">
      <div class="icon">⬡</div>
      <div>Select a run to inspect its IO flow</div>
    </div>

    <div id="detail-content" style="display:none; flex-direction:column; height:100%; overflow:hidden;">
      <div id="detail-header">
        <div id="detail-question">—</div>
        <div id="detail-meta">
          <span class="detail-status" id="detail-status"></span>
          <span id="detail-type-badge"></span>
          <span id="detail-duration"></span>
          <span id="detail-session" style="font-family:monospace;font-size:10px"></span>
        </div>
      </div>

      <div id="detail-body">
        <!-- Flow graph -->
        <div>
          <div class="panel-header" style="background:transparent;padding:0 0 8px 0;border:none">
            Flow Graph — click a node to jump to its IO
          </div>
          <div id="flow-graph"></div>
        </div>

        <!-- Step IO cards -->
        <div id="step-io-area"></div>

        <!-- Reasoning -->
        <details id="reasoning-card">
          <summary>🧠 LLM Reasoning (thinking)</summary>
          <pre id="reasoning-text"></pre>
        </details>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";

const ICONS = {
  metadata_extraction: "📋",
  request_dispatch:    "📡",
  llm_processing:      "🧠",
  command_mapping:     "🔧",
  viz_execution:       "📊",
};

let _runs      = [];
let _activeId  = null;
let _autoTimer = null;

const $ = (id) => document.getElementById(id);

// ── Fetch ──────────────────────────────────────────────────────────────────

async function fetchRuns() {
  try {
    const res = await fetch("/api/runs");
    _runs = await res.json();
    renderRunList();
    if (_activeId) {
      // refresh detail if still visible
      const still = _runs.find((r) => r.run_id === _activeId);
      if (still) await selectRun(_activeId);
    }
  } catch (e) {
    console.error("fetchRuns:", e);
  }
}

async function fetchRunDetail(runId) {
  const res = await fetch(`/api/runs/${runId}`);
  return res.json();
}

async function fetchHealth() {
  try {
    const res  = await fetch("/health");
    const data = await res.json();
    $("header-model").textContent = data.model ?? "—";
  } catch {
    $("header-model").textContent = "backend offline";
  }
}

// ── Run list ───────────────────────────────────────────────────────────────

function renderRunList() {
  const el = $("run-list");
  if (!_runs.length) {
    el.innerHTML = '<div class="none-label" style="padding:16px">No runs yet.</div>';
    return;
  }
  el.innerHTML = _runs.map((r) => {
    const time = new Date(r.started_at).toLocaleTimeString();
    const dur  = r.duration_ms != null ? fmtMs(r.duration_ms) : "—";
    const active = r.run_id === _activeId ? " active" : "";
    return `
      <div class="run-item${active}" data-id="${r.run_id}">
        <div class="run-item-top">
          <span class="run-badge badge-${r.run_type}">${r.run_type}</span>
          <span class="status-dot dot-${r.status}"></span>
          <span class="run-question" title="${esc(r.question)}">${esc(r.question)}</span>
        </div>
        <div class="run-meta">
          <span>${time}</span>
          <span>${dur}</span>
          ${r.final_viz_type ? `<span class="run-viz-type">${r.final_viz_type}</span>` : ""}
          ${r.attempts > 1   ? `<span style="color:var(--yellow)">⚠ ${r.attempts} attempts</span>` : ""}
        </div>
      </div>`;
  }).join("");

  el.querySelectorAll(".run-item").forEach((item) => {
    item.addEventListener("click", () => selectRun(item.dataset.id));
  });
}

// ── Detail view ────────────────────────────────────────────────────────────

async function selectRun(runId) {
  _activeId = runId;
  renderRunList();

  const run = await fetchRunDetail(runId);

  $("empty-state").style.display    = "none";
  const dc = $("detail-content");
  dc.style.display = "flex";

  $("detail-question").textContent = run.question;
  const statusEl = $("detail-status");
  statusEl.textContent  = run.status.toUpperCase();
  statusEl.className    = `detail-status ${run.status}`;
  $("detail-type-badge").innerHTML = `<span class="run-badge badge-${run.run_type}">${run.run_type}</span>`;
  $("detail-duration").textContent = run.duration_ms != null ? fmtMs(run.duration_ms) : "";
  $("detail-session").textContent  = run.session_id ? `session: ${run.session_id.slice(0,8)}…` : "";

  renderFlowGraph(run);
  renderStepIO(run);
  renderReasoning(run);
}

// ── Flow graph ─────────────────────────────────────────────────────────────

function renderFlowGraph(run) {
  const el = $("flow-graph");
  const steps = run.steps ?? [];
  el.innerHTML = steps.map((s, i) => {
    const dur = s.duration_ms != null ? fmtMs(s.duration_ms) : "";
    const connector = i < steps.length - 1
      ? `<div class="flow-connector ${s.status === "success" ? "done" : ""}">
           <svg width="28" height="16" viewBox="0 0 28 16" fill="none">
             <line x1="0" y1="8" x2="20" y2="8" stroke="currentColor" stroke-width="1.5"/>
             <polyline points="16,4 22,8 16,12" fill="none" stroke="currentColor" stroke-width="1.5"/>
           </svg>
         </div>`
      : "";
    return `
      <div class="flow-node" data-step="${s.id}" title="${s.label}">
        <div class="flow-node-box status-${s.status}">
          <div class="flow-icon">${ICONS[s.id] ?? "⬡"}</div>
          <div class="flow-label">${s.label.replace(" ", "\n")}</div>
          ${dur ? `<div class="flow-duration">${dur}</div>` : ""}
        </div>
      </div>
      ${connector}`;
  }).join("");

  el.querySelectorAll(".flow-node").forEach((node) => {
    node.addEventListener("click", () => {
      el.querySelectorAll(".flow-node").forEach((n) => n.classList.remove("active"));
      node.classList.add("active");
      const card = document.querySelector(`[data-io-step="${node.dataset.step}"]`);
      card?.scrollIntoView({ behavior: "smooth", block: "nearest" });
    });
  });
}

// ── Step IO cards ──────────────────────────────────────────────────────────

function renderStepIO(run) {
  const area = $("step-io-area");
  const steps = run.steps ?? [];
  area.innerHTML = steps.map((s) => {
    const dur   = s.duration_ms != null ? fmtMs(s.duration_ms) : "";
    const ioGrid = (s.input || s.output) ? `
      <div class="io-grid">
        <div class="io-cell in">
          <div class="io-cell-label">▶ Input</div>
          <pre>${s.input ? esc(s.input) : '<span class="none-label">—</span>'}</pre>
        </div>
        <div class="io-cell out">
          <div class="io-cell-label">◀ Output</div>
          <pre>${s.output ? esc(s.output) : '<span class="none-label">—</span>'}</pre>
        </div>
      </div>` : "";
    const errRow = s.error ? `<div class="io-error">✕ ${esc(s.error)}</div>` : "";
    return `
      <div class="io-card" data-io-step="${s.id}">
        <div class="io-card-header">
          <span>${ICONS[s.id] ?? "⬡"}</span>
          <span class="io-card-title">${s.label}</span>
          ${dur ? `<span class="io-duration">${dur}</span>` : ""}
          <span class="io-status-badge ${s.status}">${s.status}</span>
        </div>
        ${ioGrid}
        ${errRow}
      </div>`;
  }).join("");
}

// ── Reasoning ─────────────────────────────────────────────────────────────

function renderReasoning(run) {
  const card = $("reasoning-card");
  const text = $("reasoning-text");
  if (run.reasoning_text) {
    text.textContent = run.reasoning_text;
    card.style.display = "";
  } else {
    card.style.display = "none";
  }
}

// ── Helpers ────────────────────────────────────────────────────────────────

function fmtMs(ms) {
  return ms < 1000 ? `${Math.round(ms)}ms` : `${(ms / 1000).toFixed(1)}s`;
}

function esc(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

// ── Auto-refresh ───────────────────────────────────────────────────────────

function startAutoRefresh() {
  stopAutoRefresh();
  _autoTimer = setInterval(fetchRuns, 5000);
}
function stopAutoRefresh() {
  if (_autoTimer) { clearInterval(_autoTimer); _autoTimer = null; }
}

$("refresh-btn").addEventListener("click", fetchRuns);
$("auto-toggle").addEventListener("change", (e) => {
  e.target.checked ? startAutoRefresh() : stopAutoRefresh();
});

// ── Init ───────────────────────────────────────────────────────────────────

fetchHealth();
fetchRuns();
startAutoRefresh();
</script>
</body>
</html>
